# 태그를 밀면 Windows 설치파일과 업데이터 파일을 만들어 Release에 올린다.
#
#   npm run version:set 0.1.1
#   git commit -am "v0.1.1"
#   git tag v0.1.1 && git push origin main --tags
#
# 저장소: lohemal/AfterSchool-Total-Manager
# 아래 latest.json 의 주소는 ${{ github.repository }} 로 받으므로, 저장소 이름이
# 바뀌어도 이 파일은 고칠 것이 없다.
#
# Release에 반드시 올라가야 하는 것 (하나라도 빠지면 업데이트가 안 된다)
#   · afterschool_<버전>_x64-setup.exe        설치파일
#   · afterschool_<버전>_x64-setup.exe.sig    서명
#   · latest.json                             업데이터가 읽는 목록
#   · SHA256SUMS.txt                          직접 받은 파일 검증용
#
# ## 왜 tauri-action의 includeUpdaterJson을 쓰지 않는가
#
# 앱 이름이 한글이라 makensis가 만드는 파일 이름도 한글이다
# (`방과후 통합 매니저_0.1.0_x64-setup.exe`). 그런데 GitHub Release는 첨부
# 파일 이름에서 한글을 떼어 내 `_0.1.0_x64-setup.exe`로 바꿔 버린다.
# 그러면 latest.json이 가리키는 주소와 실제 첨부 파일 주소가 어긋나 업데이트가
# "받는 중"에서 실패한다. 그래서 **영문 이름으로 복사한 뒤 latest.json을 직접
# 만든다.** 앱 화면에 보이는 이름은 그대로 한글이다.
#
# 서명 키는 저장소에 두지 않고 GitHub Secrets에서만 넘긴다.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 버전 세 곳이 어긋나면 업데이터가 새 버전을 못 알아본다 — 먼저 막는다
      - name: 버전·업데이터 설정 검사
        run: cargo test --manifest-path src-tauri/Cargo.toml version_tests

      - name: 전체 테스트
        run: npm run check

      - name: 설치파일 만들기·서명
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build

      - name: 파일 이름 정리·latest.json 만들기
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $dir = "src-tauri/target/release/bundle/nsis"

          $exe = Get-ChildItem "$dir/*_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "설치 파일을 찾지 못했습니다: $dir" }

          # 서명이 없으면 설치는 되지만 업데이트가 안 된다. 여기서 막는다.
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "서명 파일이 없습니다. TAURI_SIGNING_PRIVATE_KEY 시크릿을 확인하세요."
          }
          $sig = (Get-Content $sigPath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sig)) { throw "서명이 비어 있습니다." }

          $out = "release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $name = "afterschool_${ver}_x64-setup.exe"
          Copy-Item $exe.FullName "$out/$name"
          Copy-Item $sigPath      "$out/$name.sig"

          # 업데이터가 읽는 파일. url 이 실제 첨부 파일 주소와 정확히 같아야 한다.
          $json = [ordered]@{
            version   = $ver
            notes     = "자세한 변경 내용은 릴리스 페이지를 확인해 주세요."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
              }
            }
          }
          # BOM 이 있으면 업데이터가 읽지 못한다
          $json | ConvertTo-Json -Depth 6 | Set-Content "$out/latest.json" -Encoding utf8NoBOM

          # 직접 내려받은 파일이 온전한지 확인할 수 있게 체크섬도 올린다
          $hash = (Get-FileHash "$out/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "$out/SHA256SUMS.txt" -Encoding utf8NoBOM

          Write-Host "만들어진 파일:"
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $notes = @"
          ## 설치 방법

          아래 ``afterschool_${ver}_x64-setup.exe`` 를 내려받아 실행하세요.
          관리자 권한이 필요 없습니다.

          > Windows가 "PC를 보호했습니다" 창을 띄우면 **추가 정보 → 실행** 을 누르세요.
          > 코드 서명 인증서가 없는 프로그램은 모두 이렇게 나옵니다.

          이미 쓰고 계신 분은 프로그램 안에서
          **시스템 → 프로그램 업데이트 → [업데이트 확인]** 을 누르면 바로 받을 수 있습니다.

          ## 자료는 그대로 남습니다

          업무 자료는 프로그램과 따로 ``%APPDATA%\kr.school.afterschool`` 에 있습니다.
          업데이트해도, 프로그램을 지웠다 다시 깔아도 그대로입니다.

          ## 첨부 파일

          | 파일 | 무엇인가요 |
          |---|---|
          | ``afterschool_….exe`` | 설치 파일. 이것만 받으면 됩니다 |
          | ``afterschool_….exe.sig`` | 서명. 프로그램이 업데이트할 때 확인합니다 |
          | ``latest.json`` | 업데이트 정보. 프로그램이 읽습니다 |
          | ``SHA256SUMS.txt`` | 내려받은 파일이 온전한지 확인용 |
          "@

          # 같은 태그로 다시 돌릴 때를 대비해, 있으면 지우고 새로 만든다
          gh release delete $tag --yes --cleanup-tag=false 2>$null
          gh release create $tag (Get-ChildItem release | ForEach-Object { $_.FullName }) `
            --title "방과후 통합 매니저 $tag" `
            --notes $notes
