[package]
name = "afterschool"
version = "0.1.10"
description = "방과후 통합 매니저"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "afterschool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = "0.4"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
calamine = "0.26"
rust_xlsxwriter = "0.79"
uuid = { version = "1", features = ["v4"] }
# 방과후드림 결제관리 — 개인참조번호·생년월일 암호화. 판은 경력증명서 앱에서 검증한 것과 같다.
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

# DPAPI — tauri(tao)가 이미 쓰는 windows 0.61 판에 기능만 더한다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
